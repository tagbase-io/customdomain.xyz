<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- GitHub Pages cannot send a 301, so the root redirects here instead. A
         tap arrives at /?tid=... and falls through to the page below. -->
    <script>
      if (location.pathname === "/" && !new URLSearchParams(location.search).has("tid")) {
        location.replace("https://verify.tagbase.io/docs/your-domain/external-verification");
      }
    </script>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <title>customdomain.xyz | Product verification on your own domain</title>
    <meta
      name="description"
      content="A demo of TAGBASE verification running on a brand's own domain. Tap a tag and this page tells you what the product is and whether it is real."
    />
    <meta name="author" content="TAGBASE" />

    <meta property="og:title" content="Add TAGBASE to your website" />
    <meta
      property="og:description"
      content="A demo of TAGBASE verification running on a brand's own domain. Tap a tag and this page tells you what the product is and whether it is real."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://customdomain.xyz/" />
    <meta property="og:image" content="https://customdomain.xyz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tagbase" />
    <meta name="twitter:image" content="https://customdomain.xyz/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@tagbase-io/verify"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
